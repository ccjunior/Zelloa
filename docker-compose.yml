services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ZELLOA_POSTGRES_DB:?Configure ZELLOA_POSTGRES_DB}
      POSTGRES_USER: ${ZELLOA_POSTGRES_USER:?Configure ZELLOA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ZELLOA_POSTGRES_PASSWORD:?Configure ZELLOA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - zelloa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__ZelloaDatabase: "Host=postgres;Port=5432;Database=${ZELLOA_POSTGRES_DB:?Configure ZELLOA_POSTGRES_DB};Username=${ZELLOA_POSTGRES_USER:?Configure ZELLOA_POSTGRES_USER};Password=${ZELLOA_POSTGRES_PASSWORD:?Configure ZELLOA_POSTGRES_PASSWORD}"
      IdentityBootstrap__PlatformAdmin__Email: ${ZELLOA_BOOTSTRAP_ADMIN_EMAIL:-}
      IdentityBootstrap__PlatformAdmin__Password: ${ZELLOA_BOOTSTRAP_ADMIN_PASSWORD:-}
      Cors__AllowedOrigins__0: ${ZELLOA_FAMILY_URL:?Configure ZELLOA_FAMILY_URL}
      Cors__AllowedOrigins__1: ${ZELLOA_SCHOOL_URL:?Configure ZELLOA_SCHOOL_URL}
      Cors__AllowedOrigins__2: ${ZELLOA_ADMIN_URL:?Configure ZELLOA_ADMIN_URL}
      InvitationUrls__Family: ${ZELLOA_FAMILY_URL:?Configure ZELLOA_FAMILY_URL}
      InvitationUrls__School: ${ZELLOA_SCHOOL_URL:?Configure ZELLOA_SCHOOL_URL}
    depends_on:
      postgres:
        condition: service_healthy

  family:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: zelloa-family
    depends_on:
      - api

  school:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: zelloa-school
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        APP_NAME: zelloa-admin
    depends_on:
      - api

volumes:
  zelloa-postgres-data:
